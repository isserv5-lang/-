<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>编剧灵感星图 · Antigravity Story Graph</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <!-- 全屏沉浸式纯黑图谱画布 -->
  <main id="canvas-stage" class="canvas-stage" aria-label="反重力动态交互图谱画布">
    <div id="canvas-grid" class="canvas-grid"></div>

    <!-- 主 SVG 画布（全屏自适应 + 平移缩放） -->
    <svg id="graph-svg" class="graph-svg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- 标准箭头 -->
        <marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#434b5c" />
        </marker>
        <marker id="arrow-active" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
          <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#8ab4f8" />
        </marker>
        <marker id="arrow-good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
          <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#fbbf24" />
        </marker>
        <marker id="arrow-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
          <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#f87171" />
        </marker>

        <!-- 柔光滤镜 -->
        <filter id="glow-soft" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="3.5" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
        <filter id="glow-drop" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="6" result="blur" />
          <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>

      <!-- 平移与缩放容器 -->
      <g id="graph-viewport">
        <g id="layer-groups"></g>
        <g id="layer-edges"></g>
        <g id="layer-particles"></g>
        <g id="layer-nodes"></g>
      </g>
    </svg>

    <!-- 拖拽文件全局高亮提示层 -->
    <div id="drop-hint-banner" class="drop-hint-banner hidden">
      拖放到任意标签胶囊上松手，即可自动解析喂书
    </div>
  </main>

  <!-- 顶部悬浮半透明毛玻璃胶囊栏 (高 44px) -->
  <header class="floating-topbar" role="banner">
    <!-- 左侧双模式切换 -->
    <div class="mode-switch" role="tablist" aria-label="图谱模式">
      <button id="mode-universe" class="mode-pill active" type="button" data-mode="universe">
        <span class="mode-dot dot-universe">◉</span> 知识星图
      </button>
      <button id="mode-branching" class="mode-pill" type="button" data-mode="branching">
        <span class="mode-dot dot-branching">◎</span> 互动支线
      </button>
    </div>

    <!-- 中间搜索与轻巧过滤 / 支线切换栏 -->
    <div class="topbar-center">
      <!-- 知识星图模式控制 -->
      <div id="controls-universe" class="center-group">
        <div class="search-pill">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="search-input" type="search" placeholder="搜标签 / 书名 / 台词梗..." autocomplete="off" />
          <button id="search-clear" class="icon-clear hidden" type="button" title="清空">×</button>
        </div>
        <button id="filter-populated-btn" class="filter-toggle" type="button" title="切换显示全部标签或仅看已有素材的标签">
          <span id="filter-populated-label">全部标签</span>
        </button>
      </div>

      <!-- 互动支线模式控制 -->
      <div id="controls-branching" class="center-group hidden">
        <select id="branch-project-select" class="project-select" aria-label="选择互动剧本"></select>
        <button id="btn-new-project" class="mini-pill-btn" type="button">+ 新剧本</button>
        <button id="btn-export-project" class="mini-pill-btn" type="button">导出 MD</button>
        <span id="branch-health-pill" class="health-pill">健康</span>
      </div>
    </div>

    <!-- 右侧仅 2 个精致胶囊按钮 -->
    <div class="topbar-actions">
      <button id="btn-feed-novel" class="action-pill pill-feed" type="button" title="选择本地 .txt / .docx 小说导入，或直接拖文件到标签胶囊上">
        + 喂小说
      </button>
      <button id="btn-jinghua-lock" class="action-pill pill-lock" type="button" title="打开精话锁去油腻检测与禁词库">
        🔒 精话锁 <span id="lock-rule-count" class="count-chip">0</span>
      </button>
    </div>
  </header>

  <!-- 隐藏本地文件选择框 -->
  <input id="novel-file-input" type="file" accept=".txt,.docx" hidden />

  <!-- 喂小说快捷目标标签选择浮层（支持主标签 + 0~4个副标签 + AI自动识别开关） -->
  <div id="upload-tag-popover" class="floating-popover hidden" role="dialog" aria-label="选择喂入标签与副标签">
    <div class="popover-header">
      <div>
        <div class="popover-title">喂入标签抽屉（支持一书多签）</div>
        <div id="upload-file-name" class="popover-sub"></div>
      </div>
      <button id="upload-popover-close" class="icon-btn" type="button">×</button>
    </div>
    <div class="upload-selected-bar">
      <div id="upload-selected-chips" class="upload-selected-chips"></div>
      <div class="upload-options-row">
        <label class="ai-toggle-pill" title="导入时自动识别全书高频特征词并补充 1~3 个副标签">
          <input id="upload-auto-detect" type="checkbox" checked />
          <span>✦ AI 自动识别副标签</span>
        </label>
        <button id="upload-confirm-btn" class="pill-btn-primary" type="button" disabled>开始导入</button>
      </div>
    </div>
    <div class="popover-search-wrap">
      <input id="upload-tag-filter" type="text" placeholder="快速过滤标签（点选主标签 + 0~4个副标签）..." autocomplete="off" />
    </div>
    <div id="upload-tag-list" class="upload-tag-grid"></div>
  </div>

  <!-- 新建互动剧本微型浮层 -->
  <div id="new-project-popover" class="floating-popover compact-popover hidden" role="dialog" aria-label="新建互动支线剧本">
    <div class="popover-header">
      <div class="popover-title">新建互动支线剧本</div>
      <button id="new-proj-close" class="icon-btn" type="button">×</button>
    </div>
    <div class="popover-body">
      <input id="new-proj-title" class="dark-input" type="text" placeholder="剧本名称（如：总裁的试镜夜）" />
      <input id="new-proj-synopsis" class="dark-input" type="text" placeholder="一句话冲突设定（可选）" />
      <div class="popover-footer-row">
        <button id="new-proj-submit" class="pill-btn-primary" type="button">创建并生成起始幕</button>
      </div>
    </div>
  </div>

  <!-- 右侧极简滑出抽屉 (Slide-over Drawer, 宽 400px) -->
  <aside id="side-drawer" class="side-drawer" aria-hidden="true">
    <div class="drawer-header">
      <div class="drawer-title-wrap">
        <div id="drawer-kicker" class="drawer-kicker"></div>
        <h2 id="drawer-title" class="drawer-title"></h2>
      </div>
      <div class="drawer-head-actions">
        <button id="drawer-feed-here" class="mini-pill-btn hidden" type="button">+ 喂入此标签</button>
        <button id="drawer-close" class="icon-btn" type="button" title="收起 (Esc)">×</button>
      </div>
    </div>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>

  <!-- 「🔒 精话锁」极简浮层 -->
  <section id="jinghua-panel" class="jinghua-panel hidden" role="dialog" aria-label="精话锁去油腻工具">
    <div class="popover-header">
      <div>
        <div class="popover-title">🔒 精话锁 · 去AI油腻旁白</div>
        <div class="popover-sub">引号内台词自动保护，只抓引号外油腻腔调</div>
      </div>
      <button id="jinghua-close" class="icon-btn" type="button" title="关闭 (Esc)">×</button>
    </div>

    <div class="jinghua-checker">
      <textarea id="jinghua-input" class="dark-textarea" rows="4" placeholder="贴入台本或正文片段，秒标红“瞬间卡壳 / 夹细八度 / 涨成猪肝色”等油腻旁白..."></textarea>
      <div class="jinghua-check-bar">
        <span id="jinghua-score-badge" class="score-badge hidden"></span>
        <button id="jinghua-run-btn" class="pill-btn-primary" type="button">立即体检</button>
      </div>
      <div id="jinghua-result-box" class="jinghua-result-box hidden"></div>
    </div>

    <div class="jinghua-rules-section">
      <div class="section-mini-title">
        <span>禁词胶囊库</span>
        <span id="jinghua-rules-meta" class="muted-text"></span>
      </div>
      <div id="jinghua-rules-cloud" class="rules-cloud"></div>
      <div class="rule-add-row">
        <input id="jinghua-new-pattern" class="dark-input" type="text" placeholder="输入新禁词，回车即拉黑（如：仿佛过了一个世纪）" />
      </div>
    </div>
  </section>

  <!-- 底部极简图例栏（致敬参考图底部） -->
  <footer class="bottom-legend" aria-label="图谱图例">
    <span id="legend-text">
      <span class="leg-item"><span class="leg-arrow">→</span> 连线粗细 = 积累好梗量</span>
      <span class="leg-sep">·</span>
      <span class="leg-item"><span class="leg-sec-arc"></span> 虚线弧 = 副标签跨连</span>
      <span class="leg-sep">·</span>
      <span class="leg-item"><span class="leg-dashed"></span> 虚线胶囊 = 空抽屉/待补节点</span>
      <span class="leg-sep">·</span>
      <span class="leg-item"><span class="leg-halo"></span> 双环光晕 = 焦点节点</span>
      <span class="leg-sep">·</span>
      <span class="leg-item">滚轮缩放 / 拖拽节点 / 双击居中 / 拖文件到标签即可喂书</span>
    </span>
    <div class="zoom-controls">
      <button id="btn-fit-view" class="zoom-btn" type="button" title="居中对齐 (双击画布)">⌖</button>
      <span id="zoom-pct" class="zoom-pct">100%</span>
    </div>
  </footer>

  <!-- 全局轻提示 -->
  <div id="toast-stack" class="toast-stack" aria-live="polite"></div>

  <script src="/static/app.js"></script>
</body>
</html>
