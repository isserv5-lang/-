[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "screenwriter-kb"
version = "0.1.0"
description = "Local-first novel craft knowledge base, Jinghua Lock style purifier, and interactive branching drama studio."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "charset-normalizer>=3.3.0",
    "rapidfuzz>=3.9.0",
    "rjieba>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
swkb = "swkb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/swkb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
